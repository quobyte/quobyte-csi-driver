name: Compile and run tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Install Dependencies
      run: go mod tidy

    - name: Build for amd64
      run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o quobyte-csi ./cmd/main.go
    
    - name: Build for arm64
      run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o quobyte-csi ./cmd/main.go

    - name: Run Tests
      run: go test -v ./...